<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Five basic joint types with typical weld</title>
  <desc id="desc">Diagram of the five basic joint types recognized by AWS: butt, lap, tee, corner, and edge, each shown with a typical weld.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#F7FAFC"/>
  <text x="400" y="35" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="bold" fill="#2D3748">Five Basic Joint Types (AWS)</text>

  <defs>
    <linearGradient id="plate2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
  </defs>

  <!-- Butt -->
  <g transform="translate(50,90)">
    <text x="70" y="0" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#2D3748">Butt</text>
    <rect x="0" y="30" width="60" height="20" fill="url(#plate2)"/>
    <rect x="80" y="30" width="60" height="20" fill="url(#plate2)"/>
    <polygon points="60,30 80,30 82,20 58,20" fill="#DD6B20"/>
    <text x="70" y="80" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">End-to-end</text>
    <text x="70" y="95" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Groove weld</text>
  </g>

  <!-- Lap -->
  <g transform="translate(230,90)">
    <text x="70" y="0" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#2D3748">Lap</text>
    <rect x="0" y="30" width="100" height="20" fill="url(#plate2)"/>
    <rect x="60" y="50" width="100" height="20" fill="url(#plate2)"/>
    <polygon points="100,30 100,50 80,50" fill="#DD6B20"/>
    <text x="80" y="90" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Overlapping</text>
    <text x="80" y="105" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Fillet weld</text>
  </g>

  <!-- Tee -->
  <g transform="translate(430,90)">
    <text x="70" y="0" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#2D3748">Tee</text>
    <rect x="0" y="60" width="140" height="20" fill="url(#plate2)"/>
    <rect x="60" y="10" width="20" height="50" fill="url(#plate2)"/>
    <polygon points="60,60 80,60 80,45 60,60" fill="#DD6B20"/>
    <polygon points="80,60 60,60 80,45 80,60" fill="#DD6B20"/>
    <polygon points="80,60 80,60 100,60 80,45" fill="#DD6B20"/>
    <text x="70" y="105" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Perpendicular</text>
    <text x="70" y="120" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Fillet weld</text>
  </g>

  <!-- Corner -->
  <g transform="translate(50,290)">
    <text x="70" y="0" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#2D3748">Corner</text>
    <rect x="0" y="60" width="80" height="20" fill="url(#plate2)"/>
    <rect x="60" y="10" width="20" height="50" fill="url(#plate2)"/>
    <polygon points="80,60 100,60 100,45 80,45" fill="#DD6B20"/>
    <text x="60" y="100" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">L-shape corner</text>
    <text x="60" y="115" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Groove or fillet</text>
  </g>

  <!-- Edge -->
  <g transform="translate(280,290)">
    <text x="80" y="0" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#2D3748">Edge</text>
    <rect x="30" y="30" width="20" height="60" fill="url(#plate2)"/>
    <rect x="60" y="30" width="20" height="60" fill="url(#plate2)"/>
    <polygon points="30,30 80,30 80,20 30,20" fill="#DD6B20"/>
    <text x="55" y="115" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">Parallel edges</text>
    <text x="55" y="130" text-anchor="middle" font-family="system-ui" font-size="11" fill="#4A5568">joined at end</text>
  </g>

  <!-- Legend -->
  <rect x="500" y="290" width="240" height="150" fill="white" stroke="#CBD5E0" rx="4"/>
  <text x="620" y="315" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#2D3748">Notes</text>
  <text x="515" y="340" font-family="system-ui" font-size="11" fill="#4A5568">• Every joint may use a groove weld,</text>
  <text x="515" y="356" font-family="system-ui" font-size="11" fill="#4A5568">  a fillet weld, or both</text>
  <text x="515" y="376" font-family="system-ui" font-size="11" fill="#4A5568">• Butt joint = groove weld (usually)</text>
  <text x="515" y="392" font-family="system-ui" font-size="11" fill="#4A5568">• Tee &amp; lap joints = fillet weld</text>
  <text x="515" y="408" font-family="system-ui" font-size="11" fill="#4A5568">  (usually)</text>
  <text x="515" y="428" font-family="system-ui" font-size="11" fill="#4A5568">• Orange = weld metal</text>
</svg>
